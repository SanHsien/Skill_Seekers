name: Fork product tests

# Runs the product tests (tests/) that the fork has ported or changed.
# Upstream's tests.yml is guarded to yusufkaraaslan/Skill_Seekers and never runs here;
# ci.yml only covers tools/tests. This workflow closes that gap on Windows.
# Scope and exclusions: tools/fork_product_tests.txt and docs/DECISIONS.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-product-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-tests:
    name: product tests (windows / py3.12)
    if: github.repository == 'SanHsien/Skill_Seekers'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.12.17"

      - name: Sync locked product and test dependencies
        run: uv sync --locked --extra mcp --extra ui

      - name: Run fork product tests (offline subset)
        shell: pwsh
        run: |
          $files = Get-Content tools/fork_product_tests.txt | Where-Object { $_ -and -not $_.StartsWith("#") }
          if (-not $files) { throw "tools/fork_product_tests.txt lists no test files." }
          uv run --locked --extra mcp --extra ui python -m pytest @files -m "not integration and not e2e and not network and not slow" -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
