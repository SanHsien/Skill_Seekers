name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentence-transformers-security:
    name: sentence-transformers security (windows / py3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.12.17"

      - name: Sync locked embedding dependencies
        run: uv sync --extra embedding --locked

      - name: Verify Sentence Transformers security regression
        shell: pwsh
        run: |
          uv run --extra embedding --locked python -c "import sentence_transformers; print('sentence-transformers', sentence_transformers.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          uv run --extra embedding --locked python -m pytest tools/tests/test_sentence_transformers_security.py -q --junitxml=sentence-transformers-security.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$result = Get-Content sentence-transformers-security.xml
          $suite = $result.testsuites.testsuite
          if ($suite.tests -ne "1" -or $suite.skipped -ne "0" -or $suite.failures -ne "0" -or $suite.errors -ne "0") {
            throw "Expected one passed security test with no skips, failures, or errors."
          }

  test-windows:
    name: test (windows / py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Canonical Windows development gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/dev_check.ps1
